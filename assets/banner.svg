<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <!-- Vibrant Gradient Accents -->
    <linearGradient id="primary-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="chart-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.0" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1F2937" stroke-width="1" stroke-opacity="0.6" />
    </pattern>

    <!-- Embedded CSS Animations for Dynamic Effects -->
    <style>
      .orb-1 {
        animation: floatOrb1 12s ease-in-out infinite alternate;
      }
      .orb-2 {
        animation: floatOrb2 10s ease-in-out infinite alternate;
      }
      .badge-float-1 {
        animation: floatBadge1 4s ease-in-out infinite alternate;
      }
      .badge-float-2 {
        animation: floatBadge2 5s ease-in-out infinite alternate;
      }
      .badge-float-3 {
        animation: floatBadge3 4.5s ease-in-out infinite alternate;
      }
      .chart-pulse {
        animation: pulseChart 6s ease-in-out infinite alternate;
      }

      @keyframes floatOrb1 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(60px, 40px); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0, 0); }
        100% { transform: translate(-50px, -30px); }
      }
      @keyframes floatBadge1 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-8px); }
      }
      @keyframes floatBadge2 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(8px); }
      }
      @keyframes floatBadge3 {
        0% { transform: translateY(0px); }
        100% { transform: translateY(-6px); }
      }
      @keyframes pulseChart {
        0% { opacity: 0.3; }
        100% { opacity: 0.5; }
      }
    </style>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bg-grad)" />
  <rect width="1200" height="400" fill="url(#grid-pattern)" />

  <!-- DYNAMIC BACKGROUND ORBS -->
  <g class="orb-1">
    <circle cx="180" cy="120" r="160" fill="#00F2FE" opacity="0.08" />
  </g>
  <g class="orb-2">
    <circle cx="1020" cy="280" r="180" fill="#8B5CF6" opacity="0.1" />
  </g>

  <!-- DYNAMIC COST GRAPH & CHART (Right Side Background) -->
  <g class="chart-pulse" transform="translate(640, 70)">
    <!-- Filled Chart Area -->
    <path d="M0,190 Q100,130 180,155 T340,90 T480,35 L480,220 L0,220 Z" fill="url(#chart-fill)" />
    <!-- Glowing Trendline -->
    <path d="M0,190 Q100,130 180,155 T340,90 T480,35" fill="none" stroke="url(#primary-glow)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Data Points -->
    <circle cx="180" cy="155" r="5" fill="#38BDF8" />
    <circle cx="340" cy="90" r="5" fill="#00F2FE" />
    <circle cx="480" cy="35" r="7" fill="#10B981" />
  </g>

  <!-- FLOATING KUBERNETES & FINOPS BADGES (Right Side Foreground) -->
  <!-- Badge 1 -->
  <g class="badge-float-1" transform="translate(850, 70)">
    <rect x="0" y="0" width="230" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="26" r="12" fill="#10B981" opacity="0.2" />
    <text x="30" y="30" text-anchor="middle" font-size="14">⚡</text>
    <text x="52" y="31" fill="#10B981" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Cost Savings: -42%</text>
  </g>

  <!-- Badge 2 -->
  <g class="badge-float-2" transform="translate(900, 145)">
    <rect x="0" y="0" width="220" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="26" r="12" fill="#38BDF8" opacity="0.2" />
    <text x="30" y="30" text-anchor="middle" font-size="14">☸️</text>
    <text x="52" y="31" fill="#38BDF8" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">Rightsized Pods</text>
  </g>

  <!-- Badge 3 -->
  <g class="badge-float-3" transform="translate(830, 220)">
    <rect x="0" y="0" width="240" height="52" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1.5" />
    <circle cx="30" cy="26" r="12" fill="#A855F7" opacity="0.2" />
    <text x="30" y="30" text-anchor="middle" font-size="14">📊</text>
    <text x="52" y="31" fill="#A855F7" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="14">OpenCost &amp; FinOps</text>
  </g>

  <!-- FOREGROUND BRANDING (Left Side - Crisp & Clear Typography) -->

  <!-- Top Pill Tag -->
  <g transform="translate(70, 75)">
    <rect x="0" y="0" width="285" height="32" rx="16" fill="#00F2FE" opacity="0.12" />
    <rect x="0" y="0" width="285" height="32" rx="16" fill="none" stroke="#00F2FE" stroke-width="1.5" opacity="0.6" />
    <text x="142" y="20" fill="#00F2FE" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1">☸️ KUBERNETES FINOPS ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="70" y="165" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="#FFFFFF" letter-spacing="-0.5">
    Awesome Kubernetes
  </text>
  <text x="70" y="218" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="44" fill="url(#primary-glow)" letter-spacing="-0.5">
    Cost Management 💰
  </text>

  <!-- Subtitle -->
  <text x="70" y="268" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">
    Curated List of SaaS Platforms &amp; Open-Source Tools for Cost Visibility,
  </text>
  <text x="70" y="293" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="400" font-size="16" fill="#94A3B8">
    Autonomous Rightsizing, FinOps Governance &amp; Intelligent Autoscaling
  </text>

  <!-- Footer Pills -->
  <g transform="translate(70, 325)">
    <!-- Pill 1 -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="135" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="67" y="19" fill="#CBD5E1" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">🏷️ SaaS Pricing</text>
    </g>

    <!-- Pill 2 -->
    <g transform="translate(148, 0)">
      <rect x="0" y="0" width="155" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="77" y="19" fill="#CBD5E1" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">⭐ Open-Source Stars</text>
    </g>

    <!-- Pill 3 -->
    <g transform="translate(315, 0)">
      <rect x="0" y="0" width="140" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1" />
      <text x="70" y="19" fill="#CBD5E1" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600">📉 Cloud FinOps</text>
    </g>
  </g>
</svg>
